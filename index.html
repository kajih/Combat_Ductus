<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Combat Ductus</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
        }
    </style>
    <!-- data-bin is required now that the crate has a second binary
         (src/bin/server.rs, native-only) alongside the client - without
         it Trunk can't tell which wasm artifact to embed. -->
    <link data-trunk rel="rust" href="Cargo.toml" data-bin="combat_ductus" />
    <!-- Trunk doesn't copy arbitrary folders into dist/ on its own - the
         Bevy AssetServer needs assets/ served over HTTP the same way it
         reads them directly from disk in the native build. -->
    <link data-trunk rel="copy-dir" href="assets" />
</head>
<body></body>
</html>
