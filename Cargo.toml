[package]
name = "combat-ductus"
version = "0.1.0"
edition = "2024"
# Now that `server` (src/bin/server.rs) exists alongside the default client
# binary (src/main.rs), `cargo run` needs to know which one is unambiguous
# for day-to-day use - the client, per CLAUDE.md. Run the server explicitly
# with `cargo run --bin server`.
default-run = "combat-ductus"

[dependencies]
bevy = "0.19.1"
# Pulls tungstenite 0.24.0 for its own native WebSocket implementation,
# while tokio-tungstenite below pulls a separate, newer tungstenite 0.30.0
# - two copies of tungstenite (and several of its own transitive deps -
# block-buffer/digest/sha1 - `cargo tree --duplicates` shows the full
# picture) coexist in the tree. No known functional impact, just extra
# compile time/binary size. ewebsock 0.8.0 (Nov 2024) is still its latest
# release; its unreleased `main` branch has since bumped to tungstenite
# 0.29 (checked 2026-09), closer but not yet a match either - there's
# nothing to upgrade to today. Known, currently-unfixable duplication, not
# silently rediscoverable via `cargo tree` each time - see
# docs/issues/tooling/ewebsock-tungstenite-version-divergence.md. Revisit
# once ewebsock next publishes a release.
ewebsock = "0.8.0"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# rand/uuid pull in getrandom, which has no default source of randomness on
# wasm32-unknown-unknown (the target used for web builds) — route it through
# the browser's Web Crypto API instead.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossbeam-channel = "0.5.17"
futures-util = "0.3.34"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.30.0"

# Run with `cargo run --features dev` to enable dynamic linking, which
# drastically speeds up incremental builds during development. Not for
# release builds (requires shipping bevy_dylib alongside the binary).
[features]
dev = ["bevy/dynamic_linking"]

# Bevy is unusably slow at runtime when compiled fully unoptimized, so keep
# dependencies (including bevy itself) optimized while leaving our own crate
# unoptimized for fast incremental compiles.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
